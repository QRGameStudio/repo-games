an class=map-btn><span r-var=l.item></span>(<span r-var=v.inventory.get(l.item)></span>t)</span></ul></div></div></div></div><div class=modal id=modal-trader-commands tabindex=-1><div class="modal-dialog modal-dialog-centered"><div class=modal-content><div class=modal-header><h5 class=modal-title>Trader<span r-var=v.trader.name></span>commands</h5><button class=close aria-label=Close data-dismiss=modal type=button><span aria-hidden=true>×</span></button></div><div class=modal-body><div><label><select r-val=w.command><option value="">Select command<option r-attr='{"value": "l.command"}'r-for="command of Object.keys(v.commands)"r-var=v.commands[l.command].description></select></label><span r-var=w.command></span><label r-if=w.command><select r-val=w.param><option value="">Select parameter<option r-attr='{"value": "l.param.id"}'r-for="param of v.commands[w.command].data"r-var=l.param.text></select></label><button class="btn btn-primary"r-click="f.sendCommand(w.command, w.param)"r-if="w.param && w.command">Send</button></div><ul><li r-for="order of v.orders"><span r-var=l.order.description></span></ul></div></div></div></div><div class=modal id=modal-station tabindex=-1><div class="modal-dialog modal-dialog-centered modal-xl"><div class=modal-content><div class=modal-header><h5 class=modal-title><span r-var=v.station.name></span></h5><button class=close aria-label=Close data-dismiss=modal type=button><span aria-hidden=true>×</span></button></div><div class=modal-body><table class="table table-hover table-striped"><thead><tr><th>Item<th>Price<th>Station<th>Player<th>Buy<th>Sell<tbody><tr r-for="item of v.items"><td><span r-var=l.item.name.toUpperCase()></span><td><span class="badge bg-primary"><span r-var=v.station.sellingPrice(l.item.name)></span><span r-var="GUt.ud('8J+qmQ==')"></span></span><span class="badge bg-danger"><span r-var=v.station.buyingPrice(l.item.name)></span><span r-var="GUt.ud('8J+qmQ==')"></span></span><td><span r-var=v.station.inventory.get(l.item.na
